name: Release

# Tag-driven. A release is the same build CI already runs, plus the artefacts —
# deliberately not a separate recipe, because a release path that differs from
# the tested path is a release path nobody has tested.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: AppImage
    runs-on: ubuntu-22.04   # oldest glibc we build against, so the bundle runs on more
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.2
          modules: qtimageformats
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev desktop-file-utils appstream

      - name: Build
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" 2>&1 | tee configure.log || {
              echo "::error title=Release configure failed::$(tail -c 2000 configure.log | tr '\n' ' ')"
              exit 1
            }
          cmake --build build --parallel 2>&1 | tee build.log || {
            echo "::error title=Release build failed::$(grep -iE 'error' build.log | head -20 | tr '\n' ' ')"
            exit 1
          }

      # The suite runs before anything is packaged. Shipping an artefact built
      # from a tree whose tests were never run is how a release becomes the
      # first place a regression is noticed.
      - name: Test
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --parallel 2 2>&1 | tee ctest.log || {
            echo "::error title=Release tests failed::$(grep -E 'tests passed|FAIL!' ctest.log | head -20 | tr '\n' ' ')"
            exit 1
          }

      - name: Stage the install tree
        run: |
          cmake --install build --prefix AppDir/usr
          desktop-file-validate AppDir/usr/share/applications/io.github.sudomonas.Napkin.desktop
          appstreamcli validate --no-net AppDir/usr/share/metainfo/io.github.sudomonas.Napkin.metainfo.xml

      - name: Build the AppImage
        run: |
          set -eux
          BASE=https://github.com/linuxdeploy
          curl -fsSLO $BASE/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO $BASE/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          # --output appimage is a separate plugin; linuxdeploy looks for it on
          # PATH and fails late without it.
          curl -fsSLO $BASE/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage
          export PATH="$PWD:$PATH"
          # Self-extract instead of mounting. These tools are AppImages
          # themselves and would otherwise need FUSE in the runner, which is one
          # more thing to depend on for no benefit.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # The image plugins are loaded by name at runtime, so linuxdeploy
          # cannot see them by walking the link tree; they are named explicitly
          # or SVG and WebP silently stop working inside the bundle.
          export EXTRA_QT_PLUGINS="imageformats;svg"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            --desktop-file AppDir/usr/share/applications/io.github.sudomonas.Napkin.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/io.github.sudomonas.Napkin.png
          # Named from the desktop entry, so match on the suffix rather than on
          # a guess about capitalisation, and say so loudly if nothing appeared.
          BUILT=$(ls *.AppImage | grep -v '^linuxdeploy' | head -1)
          test -n "$BUILT"
          mv "$BUILT" "napkin-${GITHUB_REF_NAME:-dev}-x86_64.AppImage"

      # Proves the bundle actually starts and can load its own Qt, rather than
      # only that a file was produced. --version is answered before the database
      # or the single-instance socket is touched, so this has no side effects
      # and a non-zero exit is a real failure rather than a timeout.
      # --appimage-extract-and-run avoids needing FUSE in the runner.
      - name: Smoke-test the AppImage
        run: |
          set -eux
          APPIMAGE=$(ls napkin-*.AppImage)
          chmod +x "$APPIMAGE"
          OUT=$(QT_QPA_PLATFORM=offscreen timeout 120 "./$APPIMAGE" --appimage-extract-and-run --version)
          echo "$OUT"
          # The version it reports must be the tag it was built from, or the
          # release is shipping a binary from somewhere else.
          echo "$OUT" | grep -q "napkin ${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: napkin-appimage
          path: napkin-*.AppImage

  # The same build CI's Windows job runs, then made self-contained: windeployqt
  # for Qt, SQLite from vcpkg, and the MSVC runtime copied beside the executable
  # so nobody has to install a redistributable first. A zip, not an installer:
  # it runs from wherever it is unpacked and leaves nothing behind but its data
  # in %LOCALAPPDATA%\napkin.
  windows:
    name: Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.2
          modules: qtimageformats
          cache: true

      - name: Install SQLite
        run: vcpkg install "sqlite3[fts5]:x64-windows"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: |
          $out = cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=Windows configure failed::$(($out | Select-Object -Last 25) -join ' ')"
            exit 1
          }
          $out = cmake --build build --parallel -- -k 0 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=Windows build failed::$(($out | Select-String -Pattern 'error C[0-9]+|error LNK|fatal error' | Select-Object -First 25) -join ' ')"
            exit 1
          }

      # Before packaging, for the same reason as on Linux.
      - name: Test
        run: |
          $out = ctest --test-dir build --output-on-failure --parallel 2 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=Windows release tests failed::$(($out | Select-String -Pattern 'FAIL!|tests passed|\*\*\*|Exception|Failed' | Select-Object -First 30) -join ' ')"
            exit 1
          }

      - name: Bundle
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "napkin-$env:GITHUB_REF_NAME-windows-x64"
          $dist = "dist\$name"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build\napkin.exe $dist
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\sqlite3.dll" $dist
          # The runtime is copied by hand rather than by --compiler-runtime,
          # which ships vc_redist.x64.exe for the user to run instead of the
          # DLLs themselves.
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations `
            --no-compiler-runtime --no-system-d3d-compiler --no-opengl-sw "$dist\napkin.exe"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=windeployqt failed::exit $LASTEXITCODE"; exit 1 }
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { Write-Host "::error title=No MSVC runtime::VCToolsRedistDir=$env:VCToolsRedistDir"; exit 1 }
          Copy-Item "$($crt.FullName)\*.dll" $dist
          Copy-Item LICENSE "$dist\LICENSE.txt"
          Copy-Item resources\icons\lucide\LICENSE "$dist\LICENSE-lucide.txt"

          # Image formats and SVG icons are plugins, loaded by name at runtime.
          # A bundle without them still starts, and then silently cannot show a
          # WebP or draw a toolbar button — so their absence fails the build.
          $missing = @(
            'platforms\qwindows.dll', 'imageformats\qjpeg.dll', 'imageformats\qgif.dll',
            'imageformats\qwebp.dll', 'imageformats\qsvg.dll', 'iconengines\qsvgicon.dll',
            'Qt6Svg.dll', 'sqlite3.dll', 'vcruntime140.dll', 'msvcp140.dll'
          ) | Where-Object { -not (Test-Path "$dist\$_") }
          if ($missing) {
            Write-Host "::error title=Bundle incomplete::missing $($missing -join ', ')"
            Get-ChildItem -Recurse $dist | ForEach-Object { $_.FullName } | Write-Host
            exit 1
          }
          "BUNDLE=$dist" >> $env:GITHUB_ENV
          "ZIPNAME=$name.zip" >> $env:GITHUB_ENV

      # Runs the bundle with Qt, vcpkg and the compiler off PATH, so a DLL the
      # bundle forgot cannot be quietly found on the build machine instead.
      # Constructing the application loads the Windows platform plugin before
      # --version is answered, so this proves the bundle's Qt actually starts.
      # A GUI-subsystem program shows --version in a message box unless its
      # output is redirected; Start-Process redirects it.
      - name: Smoke-test the bundle
        run: |
          $env:PATH = "C:\Windows\system32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QT_ROOT_DIR, Env:Qt6_DIR, Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $env:QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES = '1'
          $p = Start-Process -FilePath "$env:BUNDLE\napkin.exe" -ArgumentList '--version' `
                 -RedirectStandardOutput version.txt -RedirectStandardError stderr.txt -NoNewWindow -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "::error title=Smoke test hung::--version did not return"; exit 1 }
          $out = (Get-Content version.txt -Raw) + (Get-Content stderr.txt -Raw)
          Write-Host "exit $($p.ExitCode): $out"
          $want = "napkin $($env:GITHUB_REF_NAME -replace '^v','')"
          if ($p.ExitCode -ne 0 -or $out -notmatch [regex]::Escape($want)) {
            Write-Host "::error title=Smoke test failed::exit $($p.ExitCode), wanted '$want', got: $out"
            exit 1
          }

      - name: Zip
        run: Compress-Archive -Path $env:BUNDLE -DestinationPath $env:ZIPNAME

      - uses: actions/upload-artifact@v4
        with:
          name: napkin-windows
          path: napkin-*-windows-x64.zip

  # One job attaches everything, so the two platforms land on one draft release
  # rather than racing to create two.
  publish:
    name: Publish
    needs: [appimage, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artefacts/*
          draft: true
          generate_release_notes: true
